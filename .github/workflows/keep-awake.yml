name: Keep the demo awake

# The public demo runs on Render's free plan, which puts the server to sleep after 15 minutes
# without requests; waking it takes close to a minute. One small request every 10 minutes during
# the day keeps the first visit fast. The night hours (UTC) are left out to stay well inside the
# plan's free hours. GitHub pauses scheduled workflows after 60 days without activity in the
# repository: run it by hand once to start it again.
on:
  schedule:
    - cron: "*/10 5-22 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ask the demo for its health
        run: curl --silent --show-error --fail --max-time 120 --retry 2 https://backedcv.onrender.com/api/health
