# List prices in USD per million tokens, used only to show the cost of each analysis.
# Claude Haiku 5.5 has two rate cards: prompts of up to 100K tokens, and longer prompts. The input
# limits keep every prompt far below 100K tokens, so the long rates should never apply.
[prices."claude-haiku-5-5"]
input = 0.10
output = 0.50
long_prompt_tokens = 100_000
long_input = 0.50
long_output = 2.50

# Effort per call (Claude's output_config.effort): how much the model thinks before answering.
[effort]
structure_cv = "low"
extract_job = "low"
match_requirements = "low"
suggest = "medium"
verify = "high"
write_additions = "medium"
verify_additions = "high"
review_posting = "low"
hidden_barriers = "low"
build_cv = "low"
research_web = "low"
research_extract = "low"
write_outreach = "medium"

# The web search tool of the deeper analysis: the tool version the model takes, and its list price
# in USD per search, used only to show the cost.
[web_search]
tool = "web_search_20250305"
price_per_search = 0.01
